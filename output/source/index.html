const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const fr=x=>x-Math.floor(x),h=n=>fr(Math.sin(n*127.1+311.7)*43758.5453);
const mix=(a,b,t)=>{const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')};
// keyframes: [[t,v],...] smooth interpolation
function K(t,a){if(t<=a[0][0])return a[0][1];for(let i=1;i<a.length;i++){if(t<=a[i][0]){const u=ss(a[i-1][0],a[i][0],t);return lerp(a[i-1][1],a[i][1],u)}}return a[a.length-1][1]}
// ---------- paper cut helpers ----------
function pp(pts,seed,amp=2,step=22){const p=new Path2D();const n=pts.length;let first=true;
 for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.round(L/step));
  for(let j=0;j<k;j++){const f=j/k;const x=a[0]+(b[0]-a[0])*f+(h(seed+i*31+j)-.5)*2*amp,y=a[1]+(b[1]-a[1])*f+(h(seed+i*17+j+9)-.5)*2*amp;if(first){p.moveTo(x,y);first=false}else p.lineTo(x,y)}}
 p.closePath();return p}
function paper(pts,fill,o={}){const{seed=1,lw=3.4,amp=1.8,step=22}=o;const p=pp(pts,seed,amp,step);c.fillStyle=fill;c.fill(p);if(lw){c.strokeStyle=OUT;c.lineWidth=lw;c.lineJoin='round';c.stroke(p)}return p}
function rect(x,y,w,hh,fill,o={}){return paper([[x,y],[x+w,y],[x+w,y+hh],[x,y+hh]],fill,o)}
function ngon(x,y,rx,ry,fill,o={},n=26){return paper(Array.from({length:n},(_,i)=>[x+Math.cos(i/n*TAU)*rx,y+Math.sin(i/n*TAU)*ry]),fill,{amp:.9,step:12,...o})}
function circ(x,y,r,fill,o={}){return ngon(x,y,r,r,fill,o)}
function rr(x,y,w,hh,r,fill,o={}){const pts=[];const q=6;[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+hh-r,0],[x+r,y+hh-r,Math.PI/2],[x+r,y+r,Math.PI]].forEach(([cx,cy,a0])=>{for(let i=0;i<=q;i++){const a=a0+i/q*Math.PI/2;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}});return paper(pts,fill,{amp:.8,step:16,...o})}
