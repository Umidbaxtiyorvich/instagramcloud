<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To'g'rilash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #5f6368);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --accent: var(--tg-theme-button-color, #1d6fb0);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --bad: #c2292e;
    --bad-bg: rgba(229, 72, 77, .12);
    --ok: #1e7a4a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 12px; }
  img { width: 100%; border-radius: 10px; margin-bottom: 12px; max-height: 260px; object-fit: contain; background: var(--card); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 8px; text-align: left; vertical-align: top; border-bottom: 1px solid rgba(128,128,128,.15); }
  th { font-size: 12px; color: var(--hint); font-weight: 600; text-transform: uppercase; }
  tr:last-child td { border-bottom: 0; }
  td.read { width: 34%; word-break: break-word; }
  tr.bad td { background: var(--bad-bg); }
  tr.bad td.name { color: var(--bad); font-weight: 600; }
  .why { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .okmark { color: var(--ok); font-size: 12px; }
  input { width: 100%; padding: 9px 10px; font-size: 15px; border-radius: 8px; color: var(--fg);
          border: 1px solid rgba(128,128,128,.35); background: var(--bg); }
  tr.bad input { border-color: var(--bad); }
  .line { margin-top: 12px; font-size: 13px; color: var(--hint); }
  button { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px; font-size: 16px;
           font-weight: 600; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button:disabled { opacity: .5; }
  #msg { margin-top: 12px; font-weight: 600; text-align: center; }
  #msg.err { color: var(--bad); }
  #msg.good { color: var(--ok); }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="sub" id="sub"></div>
<div id="photo-slot"></div>
<table>
  <thead><tr><th>Maydon</th><th>Bot o'qigan</th><th>To'g'risi</th></tr></thead>
  <tbody>
    <tr id="r-client">
      <td class="name">🏪 Mijoz</td>
      <td class="read"><span id="v-client"></span><div class="why" id="w-client"></div></td>
      <td><input id="client" list="clients" autocomplete="off" placeholder="Mijoz nomi"></td>
    </tr>
    <tr id="r-date">
      <td class="name">📅 Sana</td>
      <td class="read"><span id="v-date"></span><div class="why" id="w-date"></div></td>
      <td><input id="date" type="date"></td>
    </tr>
    <tr id="r-amount">
      <td class="name">💰 Summa</td>
      <td class="read"><span id="v-amount"></span><div class="why" id="w-amount"></div></td>
      <td><input id="amount" type="text" inputmode="numeric" placeholder="so'm"></td>
    </tr>
  </tbody>
</table>
<datalist id="clients"></datalist>
<div class="line" id="line"></div>
<button id="send">✅ Tasdiqlash va kiritish</button>
<div id="msg"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  $('title').textContent = `${D.k + 1}-qatorni to'g'rilash`;
  $('sub').textContent = `${D.sender} · ${D.chat}`;
  if (D.photo) { const im = document.createElement('img'); im.alt = 'Rasm'; im.src = D.photo; $('photo-slot').appendChild(im); }
  $('line').textContent = D.line ? `Rasmdagi yozuv: «${D.line}»` : '';

  const byName = {};
  for (const c of D.clients) {
    const o = document.createElement('option'); o.value = c.name; $('clients').appendChild(o); byName[c.name] = c.id;
  }
  function field(key, readText, value, why) {
    $('v-' + key).textContent = readText || '—';
    $(key).value = value || '';
    if (why) { $('r-' + key).classList.add('bad'); $('w-' + key).textContent = why; }
    else { $('w-' + key).innerHTML = '<span class="okmark">✓ aniq</span>'; }
  }
  field('client', D.client_read, D.client_name, D.why.client);
  field('date', D.date_read, D.date_value, D.why.date);
  field('amount', D.amount ? money(D.amount) : '', D.amount ? money(D.amount) : '', D.why.amount);

  $('send').onclick = async () => {
    const msg = $('msg'); msg.className = ''; msg.textContent = '';
    const clientId = byName[$('client').value.trim()];
    const amount = parseInt($('amount').value.replace(/\D/g, ''), 10);
    if (!clientId) { msg.className = 'err'; msg.textContent = "Mijozni ro'yxatdan tanlang"; return; }
    if (!$('date').value) { msg.className = 'err'; msg.textContent = 'Sanani kiriting'; return; }
    if (!amount) { msg.className = 'err'; msg.textContent = 'Summani kiriting'; return; }
    $('send').disabled = true; msg.textContent = 'Kiritilmoqda...';
    try {
      const r = await fetch(location.pathname + location.search, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({initData: tg ? tg.initData : '', k: D.k, client_id: clientId,
                              date: $('date').value, amount}),
      });
      const res = await r.json();
      msg.className = res.ok ? 'good' : 'err';
      msg.textContent = res.message;
      if (res.ok && tg) setTimeout(() => tg.close(), 1800); else $('send').disabled = false;
    } catch (e) {
      msg.className = 'err'; msg.textContent = 'Aloqa xatosi: ' + e; $('send').disabled = false;
    }
  };
</script>
</body>
</html>
